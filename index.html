<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <header class="sidebar__header">
                <span class="sidebar__head text-big">ChatGPT</span>
                <div class="sidebar__right">
                    <button class="btn icon-btn" id="sidebar-search-btn" type="button" aria-label="Search chats">
                        <img class="icon" src="./assets/icons/search.svg" alt="search-ic">
                    </button>
                    <button class="btn icon-btn sidebar-close">
                        <img class="icon" src="./assets/icons/sidebar.svg" alt="sidebar-ic">
                    </button>
                </div>
                <input type="search" class="sidebar__search-input" id="sidebar-search" placeholder="Search chats..." hidden>
            </header>
            <div class="sidebar__scroll-area">
                <section class="sidebar__panel">
                    <button class="btn panel__list" id="new-chat-button" type="button">
                        <img class="icon" src="./assets/icons/new-chat.svg" alt="chat-ic">
                        <span class="text-middle">New Chat</span>
                    </button>
                    <button class="btn panel__list">
                        <img class="icon" src="./assets/icons/library.svg" alt="library-ic">
                        <span class="text-middle">Library</span>
                    </button>
                    <button class="btn panel__list">
                        <img class="icon" src="./assets/icons/more.svg" alt="more-ic">
                        <span class="text-middle">More</span>
                    </button>
                </section>

                <section class="sidebar__convo-groups">
                    <div class="convo-groups__heading">
                        <h3 class="dark-gray-bold convo-head">Chats</h3>
                        <img class="icon" src="./assets/icons/key-down.svg" alt="chevron-down-ic">
                    </div>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Today</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link" data-conversation="text" type="button">
                                    <span class="convo-item__title text-middle">var vs let vs const in JavaScript</span>
                                </button>
                                <div class="convo-item__actions">
                                    <button class="btn convo-item__more" type="button" aria-label="More options">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Yesterday</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link" data-conversation="table" type="button">
                                    <span class="convo-item__title text-middle">Frontend framework comparison</span>
                                </button>
                                <div class="convo-item__actions">
                                    <button class="btn convo-item__more" type="button" aria-label="More options">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Previous 7 Days</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link" data-conversation="links" type="button">
                                    <span class="convo-item__title text-middle">Modern CSS learning resources</span>
                                </button>
                                <div class="convo-item__actions">
                                    <button class="btn convo-item__more" type="button" aria-label="More options">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link" data-conversation="code" type="button">
                                    <span class="convo-item__title text-middle">TypeScript debounce function</span>
                                </button>
                                <div class="convo-item__actions">
                                    <button class="btn convo-item__more" type="button" aria-label="More options">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link" data-conversation="lists" type="button">
                                    <span class="convo-item__title text-middle">Clean code principles</span>
                                </button>
                                <div class="convo-item__actions">
                                    <button class="btn convo-item__more" type="button" aria-label="More options">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                </section>
            </div>

            <footer class="sidebar__footer">
                <button class="btn sidebar-account-toggle" type="button" aria-expanded="false">
                    <div class="sidebar__name-icon">YV</div>
                    <div>
                        <div class="text-middle sidebar__name">Yash Varma</div>
                        <div class="tiny-free">Free</div>
                    </div>
                </button>
                <div class="sidebar-account-menu" id="account-menu" hidden>
                    <button class="btn sidebar-account-menu__item" type="button">
                        <span>Profile</span>
                    </button>
                    <button class="btn sidebar-account-menu__item" type="button">
                        <span>Upgrade</span>
                    </button>
                    <button class="btn sidebar-account-menu__item sidebar-account-menu__item--settings" type="button">
                        <span>Settings</span>
                    </button>
                </div>
                <div class="sidebar-footer__bottom">
                    <button class="btn icon-btn text-small">
                        <img class="icon" src="./assets/icons/gift.svg" alt="gift-ic">
                        <span>Claim offer</span>
                    </button>
                </div>
            </footer>
        </aside>
        <button class="drawer-overlay" hidden></button>
        <main class="chat">
            <header class="chat__header">
                <button class="btn icon-btn sidebar-toggle" type="button">
                    <img class="icon" src="./assets/icons/menu.svg" alt="menu-icon">
                </button>
                <div class="chat__header-actions">
                    <button class="btn upgrade-button" type="button">
                        <img class="icon" src="./assets/icons/sparkle.svg" alt="sparkle-icon">
                        <span>Upgrade</span>
                    </button>
                    <a class="source-link" href="#">
                        <img class="icon" src="./assets/icons/msg.svg" alt="msg-icon">
                    </a>
                </div>
            </header>
            <section class="chat__main-chat">
                <div class="chat__convo-area" id="convo-area">
                    <div class="chat__welcome" id="welcome-state">
                        <h1 id="welcome-title">What's on your mind today?</h1>
                        <div class="chat__suggestions" id="prompt-suggestions" aria-label="Prompt suggestions"></div>
                    </div>
                    <ul class="conversation__messages" id="messages-list"></ul>
                </div>
                <form class="message-composer" id="composer-form">
                    <input type="file" id="file-input" hidden>
                    <div class="composer-attachments" id="composer-attachments" hidden></div>
                    <div class="message-composer__row">
                        <button class="btn composer-button composer-button--attach" type="button"
                            aria-label="Add attachment">
                            <img class="icon" src="./assets/icons/plus.svg" alt="plus-icon">
                        </button>
                        <textarea class="message-composer__input" id="composer-input" rows="1"
                            placeholder="Ask anything"></textarea>
                        <div class="message-composer__actions">
                            <div class="composer-button composer-button--model">
                                <img src="./assets/icons/model.svg" alt="model-ixon">
                                <select id="model-select" aria-label="Select model">
                                    <option value="" selected disabled>Model</option>
                                    <option value="fast">Fast</option>
                                    <option value="balanced">Balanced</option>
                                    <option value="reasoning">Reasoning</option>
                                </select>
                            </div>
                            <button class="btn composer-button composer-button--execute" type="submit" id="composer-send"
                                aria-label="Send message">
                                <img src="./assets/icons/up-arrow.svg" alt="up-arrow-icon">
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="settings-modal" aria-modal="true" role="dialog" hidden>
                <button class="settings-modal__backdrop" type="button"></button>
                <div class="settings-modal__panel">
                    <header class="settings-modal__header">
                        <h2 id="settings-title">Settings</h2>
                        <button class="btn settings-modal__close" type="button">×</button>
                    </header>
                    <nav class="settings-modal__nav">
                        <button class="settings-modal__nav-item is-active" type="button">Profile</button>
                        <button class="settings-modal__nav-item" type="button">Appearance</button>
                        <button class="settings-modal__nav-item" type="button">General</button>
                        <button class="settings-modal__nav-item" type="button">Keyboard shortcuts</button>
                        <button class="settings-modal__nav-item" type="button">Notifications</button>
                    </nav>
                    <div class="settings-modal__content">
                        <h3 class="content__head">Profile</h3>
                        <p class="content__para">Manage your profile, preferences, and account settings.</p>
                    </div>
                </div>
            </section>

        </main>
    </div>
    <div class="convo-menu" id="convo-menu" hidden>
        <button class="btn convo-menu__item" data-action="rename" type="button">
            <img class="icon" src="./assets/icons/rename.svg" alt="rename-icon">
            <span>Rename</span>
        </button>
        <button class="btn convo-menu__item convo-menu__item--delete" data-action="delete" type="button">
            <img class="icon" src="./assets/icons/delete.svg" alt="delete-icon">
            <span>Delete</span>
        </button>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
