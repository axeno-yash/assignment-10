<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <header class="sidebar__header">
                <span class="sidebar__head text-big">ChatGPT</span>
                <div class="sidebar__right">
                    <button class="btn icon-btn">
                        <img class="icon" src="./assets/icons/search.svg" alt="search-ic">
                    </button>
                    <button class="btn icon-btn sidebar-close">
                        <img class="icon" src="./assets/icons/sidebar.svg" alt="sidebar-ic">
                    </button>
                </div>
            </header>
            <div class="sidebar__scroll-area">
                <section class="sidebar__panel">
                    <button class="btn panel__list">
                        <img class="icon" src="./assets/icons/new-chat.svg" alt="chat-ic">
                        <span class="text-middle">New Chat</span>
                    </button>
                    <button class="btn panel__list">
                        <img class="icon" src="./assets/icons/library.svg" alt="library-ic">
                        <span class="text-middle">Library</span>
                    </button>
                    <button class="btn panel__list">
                        <img class="icon" src="./assets/icons/more.svg" alt="more-ic">
                        <span class="text-middle">More</span>
                    </button>
                </section>

                <section class="sidebar__convo-groups">
                    <div class="convo-groups__heading">
                        <h3 class="dark-gray-bold convo-head">Chats</h3>
                        <img class="icon" src="./assets/icons/key-down.svg" alt="chevron-down-ic">
                    </div>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Today</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item convo-item--active">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Yesterday</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                    <section class="convo-group">
                        <h4 class="convo-group__title text-middle">Previous 7 Days</h4>
                        <ul class="convo-group__list">
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                            <li class="list convo-item">
                                <button class="btn convo-item__link">
                                    <span class="convo-item__title text-middle">SCSS Typography Mixins</span>
                                </button>
                                <div class="convo-item__right">
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/pin.svg" alt="pin-icon">
                                    </button>
                                    <button class="btn convo-item__more">
                                        <img class="icon" src="./assets/icons/more.svg" alt="more-icon">
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </section>
                </section>
            </div>

            <footer class="sidebar__footer">
                <button class="btn sidebar-account-toggle" type="button" aria-expanded="false">
                    <div class="sidebar__name-icon">YV</div>
                    <div>
                        <div class="text-middle sidebar__name">Yash Varma</div>
                        <div class="tiny-free">Free</div>
                    </div>
                </button>
                <div class="sidebar-account-menu" id="account-menu" hidden>
                    <button class="btn sidebar-account-menu__item" type="button">
                        <span>Profile</span>
                    </button>
                    <button class="btn sidebar-account-menu__item" type="button">
                        <span>Upgrade</span>
                    </button>
                    <button class="btn sidebar-account-menu__item sidebar-account-menu__item--settings" type="button">
                        <span>Settings</span>
                    </button>
                </div>
                <div class="sidebar-footer__bottom">
                    <button class="btn icon-btn text-small">
                        <img class="icon" src="./assets/icons/gift.svg" alt="gift-ic">
                        <span>Claim offer</span>
                    </button>
                </div>
            </footer>
        </aside>
        <button class="drawer-overlay" hidden></button>
        <main class="chat">
            <header class="chat__header">
                <button class="btn icon-btn sidebar-toggle" type="button">
                    <img class="icon" src="./assets/icons/menu.svg" alt="menu-icon">
                </button>
                <div class="chat__header-actions">
                    <button class="btn upgrade-button" type="button">
                        <img class="icon" src="./assets/icons/sparkle.svg" alt="sparkle-icon">
                        <span>Upgrade</span>
                    </button>
                    <a class="source-link" href="#">
                        <img class="icon" src="./assets/icons/msg.svg" alt="msg-icon">
                    </a>
                </div>
            </header>
            <section class="chat__main-chat">
                <div class="chat__welcome">
                    <h1 id="welcome-title">What’s on your mind today?</h1>
                    <form class="message-composer" action="#">
                        <button class="btn composer-button composer-button--attach" type="button">
                            <img class="icon" src="./assets/icons/plus.svg" alt="plus-icon">
                        </button>
                        <input class="message-composer__input" type="text" placeholder="Ask anything">
                        <div class="message-composer__actions">
                            <button class="btn composer-button composer-button--model" type="button">
                                <img src="./assets/icons/model.svg" alt="model-icon">
                                <select class="btn composer-button composer-button--model">
                                    <option value="" disabled selected>Model</option>
                                    <option value="fast">Fast&nbsp;&nbsp;</option>
                                    <option value="balanced">Balanced&nbsp;&nbsp;</option>
                                    <option value="reasoning">Reasoning&nbsp;&nbsp;</option>
                                </select>
                            </button>
                            <button class="btn composer-button composer-button--execute" type="button">
                                <img src="./assets/icons/up-arrow.svg" alt="up-arrow-icon">
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="settings-modal" aria-modal="true" role="dialog" hidden>
                <button class="settings-modal__backdrop" type="button"></button>
                <div class="settings-modal__panel">
                    <header class="settings-modal__header">
                        <h2 id="settings-title">Settings</h2>
                        <button class="btn settings-modal__close" type="button">×</button>
                    </header>
                    <nav class="settings-modal__nav">
                        <button class="settings-modal__nav-item is-active" type="button">Profile</button>
                        <button class="settings-modal__nav-item" type="button">Appearance</button>
                        <button class="settings-modal__nav-item" type="button">General</button>
                        <button class="settings-modal__nav-item" type="button">Keyboard shortcuts</button>
                        <button class="settings-modal__nav-item" type="button">Notifications</button>
                    </nav>
                    <div class="settings-modal__content">
                        <h3>Profile</h3>
                        <p>Manage your profile, preferences, and account settings.</p>
                    </div>
                </div>
            </section>

        </main>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
